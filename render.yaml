services:
  - type: web
    name: myplopplop-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: COMMISSION_RATE
        value: "0.25"
      - key: FRONTEND_URL
        value: https://myplopplop.com
      # The web-push pair is NOT here any more. This repository is public, so
      # the private key written here was readable by anyone — and it was the
      # live one, confirmed by comparing it against what
      # GET /api/notifications/vapid-key handed out. The pair now lives in the
      # database (AdminSetting key 'vapid'), like the console code, and that
      # leaked pair has been replaced.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        value: mailto:info@myplopplop.com
